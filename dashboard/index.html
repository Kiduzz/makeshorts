<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-renomi.png" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />

  <!-- Fonts: Lumen system (Instrument Serif display · Geist body · JetBrains Mono labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Primary meta.
       This edition has one price (nothing) and one way to run it (your own
       machine), so the structured data below describes exactly that. Upstream
       shipped a second graph node for a hosted service with a $12-59 price
       range on it; keeping that here would have told every search engine and
       crawler that Renomi sells plans it does not sell. If you ever add paid
       hosting, add the Service node back with the real numbers rather than
       leaving a stale one in place. -->
  <title>Renomi — Self-Hosted AI Clip Generator</title>
  <meta name="description"
    content="Open source AI clip generator. Turns long videos into vertical 9:16 shorts for TikTok, Reels and YouTube Shorts. MIT licensed, runs on your own machine with Docker, no watermark and no usage cap — you bring your own API keys." />
  <meta name="author" content="Renomi" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://renomi.us/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://renomi.us/" />
  <meta property="og:title" content="Renomi — Self-Hosted AI Clip Generator" />
  <meta property="og:description"
    content="Turn long videos into viral 9:16 shorts, or generate UGC videos with AI actors. MIT licensed and self-hosted, with no watermark and no cap." />
  <meta property="og:image" content="https://renomi.us/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Renomi" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://renomi.us/" />
  <meta name="twitter:title" content="Renomi — Self-Hosted AI Clip Generator" />
  <meta name="twitter:description"
    content="MIT licensed AI clip generator you run yourself. No watermark, no cap, your own API keys." />
  <meta name="twitter:image" content="https://renomi.us/og-image.png" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Renomi",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Docker (Linux, macOS, Windows)",
      "url": "https://renomi.us/",
      "description": "Open source AI clip generator. Turns long-form video into viral-ready 9:16 clips for TikTok, Instagram Reels and YouTube Shorts using Google Gemini for moment detection, faster-whisper for word-level subtitles and MediaPipe for face-tracked reframing. Self-hosted and MIT licensed, with no watermark and no usage cap; you supply your own API keys.",
      "license": "https://opensource.org/licenses/MIT",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "codeRepository": "https://github.com/Kiduzz/makeshorts"
    }
    </script>

  <!-- Analytics — opt-in, disabled by default.
       A plain `npm run build` (and every local `npm run dev`) leaves the two
       VITE_OPENPANEL_* variables unset, so nothing is initialised, no third
       party script is fetched and no request leaves the browser. Self-hosted
       instances are silent unless you deliberately turn this on.

       To collect analytics for your own deployment: point
       VITE_OPENPANEL_API_URL / VITE_OPENPANEL_CLIENT_ID at your own OpenPanel
       instance (see .env.example) and add your hostname to ANALYTICS_HOSTS. -->
    <script>
      window.op = window.op || function () { var n = []; return new Proxy(function () { arguments.length && n.push([].slice.call(arguments)); }, { get: function (t, r) { return "q" === r ? n : function () { n.push([r].concat([].slice.call(arguments))); }; }, has: function (t, r) { return "q" === r; } }); }();
      (function () {
        // Vite substitutes these at build time and leaves the literal
        // "%VITE_...%" placeholder in place when the variable is undefined.
        var apiUrl = "%VITE_OPENPANEL_API_URL%";
        var clientId = "%VITE_OPENPANEL_CLIENT_ID%";
        var unset = function (v) { return !v || v.charAt(0) === "%"; };
        if (unset(apiUrl) || unset(clientId)) return;

        // Second gate: hosts allowed to report. A dist/ built with credentials
        // stays inert anywhere else (a fork, a mirror, a preview domain), so a
        // deployment can never report into somebody else's dashboard.
        var ANALYTICS_HOSTS = /^(www\.)?renomi\.us$/;
        if (!ANALYTICS_HOSTS.test(location.hostname)) return;

        window.op("init", {
          apiUrl: apiUrl,
          clientId: clientId,
          trackScreenViews: true,
          trackOutgoingLinks: true,
          trackAttributes: true,
        });

        var s = document.createElement("script");
        s.src = "https://openpanel.dev/op1.js";
        s.defer = true;
        s.async = true;
        document.head.appendChild(s);
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
