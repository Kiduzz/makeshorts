# Static host for the built dashboard.
#
# This serves dist/ and nothing else. The backend is a separate process (and,
# in the intended setup, a separate machine), so nothing here proxies to it —
# the SPA is built with VITE_API_URL pointing at wherever the API lives, and
# the browser calls it directly. The API answers CORS with `*`.
#
# If you deploy the dashboard to Cloudflare Pages, Netlify or similar instead,
# this file is unused: point the host at dist/ and set the SPA fallback there.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached — it points at the hashed asset bundle, so a
    # stale cached copy keeps loading the previous deploy's JS. (nginx add_header
    # doesn't inherit into a location that sets its own, so the security headers
    # are repeated here.)
    #
    # Unknown paths get a real 404, not the SPA shell: the app routes entirely
    # through the hash, which never reaches the server, so there is no deep link
    # that needs a fallback.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
