[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renomi"
version = "0.1.0"
description = "CLI for Renomi: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Renomi" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://renomi.us"
Source = "https://github.com/Kiduzz/makeshorts"
Documentation = "https://github.com/Kiduzz/makeshorts#readme"

[project.scripts]
renomi = "renomi_cli:main"

[tool.setuptools]
py-modules = ["renomi_cli"]
